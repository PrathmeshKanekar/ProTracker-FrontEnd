<main class="content">
  <div class="row p-3 bg-white">
    <!-- <div class="col-md-4">
        <label class="form-label">First Name</label>
        <input type="text" class="form-control" formControlName="businessname" />
      </div> -->
    <div class="col-md-12">
      <div class="text-end mb-3">
        <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target=".teachers" (click)="add_teacher()">
          <i class="fa fa-plus" aria-hidden="true"></i><span class="ps-2">Add Teacher</span>
        </button>
      </div>
      <table class="table table-bordered table-hover border-dark shadow-lg p-3 mb-5">
        <thead>
          <tr>
            <th>Sr.No</th>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile No</th>
            <th>Class</th>
            <th>Div</th>
            <th>Batch</th>
            <th style="width: 100px">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of teachers; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ data.name }}</td>
            <td>{{ data.email }}</td>
            <td>{{ data.mobile_no }}</td>
            <td>{{ data.class_name }}</td>
            <td>{{ data.div }}</td>
            <td>{{ data.batch }}</td>
            <td>
              <button type="button" class="btn btn-sm btn-success ms-2" (click)="edit(data.id)">
                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
              </button>
              <button type="button" class="btn btn-sm btn-danger ms-2" (click)="delete(data.id)">
                <i class="fa fa-trash" aria-hidden="true"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Large modal -->
<div class="modal fade teachers" tabindex="-1" role="dialog" aria-labelledby="myLargeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fw-bold">Add Teacher</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form class="p-1 bg-white" [formGroup]="form_data" (ngSubmit)="save(form_data.value)">
          <div class="modal-body m-2">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" formControlName="name" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="text" class="form-control" formControlName="email" />
            </div>
            <div class="mb-3">
              <label class="form-label">Mobile No</label>
              <input type="text" class="form-control" formControlName="mobile_no" />
            </div>
            <div class="mb-3">
              <label class="form-label">Class</label>
              <input type="text" class="form-control" formControlName="class_name" />
            </div>
            <div class="mb-3">
              <label class="form-label">Div</label>
              <input type="text" class="form-control" formControlName="div" />
            </div>
            <div class="mb-3">
              <label class="form-label">Batch</label>
              <input type="text" class="form-control" formControlName="batch" />
            </div>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" formControlName="username" />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="text" class="form-control" formControlName="password" />
            </div>
            <div class="mb-3">
              <label class="form-label">Security Question</label>
              <select class="form-select" formControlName="security_question">
                <option selected value="">Choose...</option>
                <option value="Favourite Food">Favourite Food</option>
                <option value="Favourite City">Favourite City</option>
                <option value="Favourite Animal">Favourite Animal</option>
              </select>
              <input type="text" class="form-control mt-2" formControlName="security_question_ans" />
            </div>
            <div class="mb-3" *ngIf="login_data">
              <label class="form-label">Status</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" id="active" name="fav_language" value="Y" [checked]="login_data.flag === 'Y'" />
                <!-- <input class="form-check-input" type="radio" id="active" name="active" value="Y"/> -->
                <label for="active">Active</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" id="deactive" name="active" value="N" [checked]="login_data.flag === 'N'" />
                <label for="deactive">Deactive</label>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
              Close
            </button>
            <button type="reset" class="btn btn-secondary">Clear</button>
            <button type="submit" class="btn btn-primary">
              <span>Save</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
