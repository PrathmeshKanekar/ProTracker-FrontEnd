<nav class="navbar navbar-light bg-light m-2">
    <h1 class="h2 ps-1 page-title"><strong>New Message</strong></h1>
  </nav>
  <main class="content">
    <div class="row p-3 bg-white">
        
        <form>
            <div class="form-group">
                <label for="taskName">Task Name</label>
                <input type="text" class="form-control" id="taskName" placeholder="Enter task name" required>
            </div>
    
            <div class="form-group">
                <label for="taskDescription">Task Description</label>
                <textarea class="form-control" id="taskDescription" rows="3" placeholder="Enter task description" required></textarea>
            </div>
    
            <div class="form-group">
                <label for="assignee">Assign To</label>
                <select class="form-control" id="assignee" required>
                    <option value="">Select a Group</option>
                    <option value="member1">Group 1</option>
                    <option value="member2"> GROUP 2</option>
                    <option value="member3">Group 3</option>
                </select>
            </div>
    
            <div class="form-group">
                <label for="dueDate">Due Date</label>
                <input type="date" class="form-control" id="dueDate" required>
            </div>
    
            <button type="submit" class="btn btn-primary">Assign Task</button>
        </form>
    </div>
  </main>
